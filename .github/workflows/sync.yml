name: Zepp Data Sync

on:
  schedule:
    # 한국 시간(KST) 매일 점심 12시(UTC 3시), 밤 12시(UTC 15시)에 자동 실행
    - cron: '0 3,15 * * *'
  workflow_dispatch: # 필요할 때 수동으로 즉시 돌릴 수 있는 버튼

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests

      - name: Zepp 동기화 스크립트 실행
        env:
          ZEPP_EMAIL: ${{ secrets.ZEPP_EMAIL }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_zepp.py
